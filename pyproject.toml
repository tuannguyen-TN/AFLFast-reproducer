[project]
name = "greybox-fuzz-repro"
version = "0.1.0"
description = "A naive coverage-guided greybox fuzzer reproducing AFLFast's power-schedule result under Klees-compliant evaluation."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q --cov=src/fuzzer -m \"not slow\""
markers = ["slow: S0 depth sweeps; run with -m slow (tester and pre-freeze only)"]
testpaths = ["tests"]
pythonpath = ["src"]
